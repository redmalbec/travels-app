services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: web1
      POSTGRES_PASSWORD: "1"
      POSTGRES_DB: Travels
    ports:
      - "127.0.0.1:5433:5432"   # ← добавьте эту строку      
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travels-net
    extra_hosts:
      - "host.docker.internal:host-gateway"   

  backend:
    build: ./backend
    env_file: ./backend/.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`travels.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    networks:
      - travels-net
    depends_on:
      - db    

  frontend:
    build: ./frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`travels.localhost`)"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    networks:
      - travels-net

  traefik:
    image: traefik:v3.6.7
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      #- "--api.insecure=true"
    ports:
      - "8082:80"
      - "8080:8080"   # Добавьте эту строку
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - travels-net

networks:
  travels-net:
    driver: bridge

volumes:
  postgres_data: